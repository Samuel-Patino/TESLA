<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>VELOX Drive</title>
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070d;
    --panel:rgba(255,255,255,.035);
    --line:rgba(255,255,255,.08);
    --txt:#eef3ff;
    --mut:rgba(226,234,255,.45);
    --a1:#3aa8ff; --a2:#7b5cff;
    --w1:#33ccff; --w2:#14e0b4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--txt);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;user-select:none;-webkit-user-select:none;
  }

  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.45}
  .orb.o1{width:50vw;height:50vw;left:-10vw;top:-15vw;background:radial-gradient(circle,#1b4dff 0%,transparent 65%)}
  .orb.o2{width:50vw;height:50vw;right:-10vw;bottom:-15vw;background:radial-gradient(circle,#00c2ff 0%,transparent 65%)}

  .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,3.5vh,40px) clamp(24px,4vw,60px)}

  /* Barra superior minimalista */
  header{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 24px rgba(58,120,255,.35)}
  .logo svg{width:22px;height:22px}
  .brand-name{font-size:20px;font-weight:900;letter-spacing:.22em}

  .hdr-right{display:flex;align-items:center;gap:14px}
  .gps-status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mut)}
  .dot{width:8px;height:8px;border-radius:50%;background:#ffb020;box-shadow:0 0 8px #ffb020}
  .dot.ok{background:#2ee59d;box-shadow:0 0 8px #2ee59d}
  .clock{font-size:22px;font-weight:800;color:var(--txt);font-variant-numeric:tabular-nums;letter-spacing:.04em;margin:0 4px}
  .icon-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);
    color:var(--txt);display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .2s}
  .icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.12)}
  .icon-btn svg{width:20px;height:20px}

  /* Centro: Tarjetas Minimalistas */
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 0}
  .modules{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,1.8vw,28px);width:100%;max-width:1440px}
  
  .card{
    position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
    min-height:clamp(260px,44vh,390px);padding:clamp(20px,2vw,36px);
    border-radius:32px;text-decoration:none;color:var(--txt);
    background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
    transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .22s,box-shadow .22s;
  }
  .card:hover,.card:focus-visible{transform:translateY(-6px);border-color:rgba(255,255,255,.2);box-shadow:0 35px 70px -15px rgba(0,0,0,.8)}
  .card:active{transform:scale(.97)}

  .card-ico{
    width:84px;height:84px;border-radius:26px;display:grid;place-items:center;margin-bottom:20px;
    transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;
  }
  .speed .card-ico{background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 14px 34px rgba(58,120,255,.35)}
  .waze .card-ico{background:linear-gradient(135deg,var(--w1),var(--w2));box-shadow:0 14px 34px rgba(51,204,255,.3)}
  .mirror .card-ico{background:linear-gradient(135deg,#a855f7,#6366f1);box-shadow:0 14px 34px rgba(168,85,247,.35)}
  .whatsapp .card-ico{background:linear-gradient(135deg,#25D366,#128C7E);box-shadow:0 14px 34px rgba(37,211,102,.35)}
  .card:hover .card-ico{transform:scale(1.06)}
  .card-ico svg{width:42px;height:42px}

  .card h2{font-size:clamp(22px,2.2vw,34px);font-weight:900;letter-spacing:-.02em}
  .card p{margin-top:8px;font-size:clamp(13px,1.1vw,16px);font-weight:500;color:var(--mut);letter-spacing:.02em}

  footer{display:flex;justify-content:center;align-items:center;font-size:12px;color:rgba(226,234,255,.25);letter-spacing:.1em;text-transform:uppercase}

  @media (max-width:1200px){
    .modules{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:680px){
    body{overflow:auto}
    .modules{grid-template-columns:1fr}
    .card{min-height:200px}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="orb o1"></div><div class="orb o2"></div>
</div>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5l8 14 8-14"/><path d="M8.5 5L12 11l3.5-6" opacity=".55"/></svg>
      </div>
      <div class="brand-name">VELOX</div>
    </div>
    <div class="hdr-right">
      <div class="gps-status" id="gpsStatus"><span class="dot" id="gpsDot"></span><span id="gpsTxt">GPS</span></div>
      <span class="clock" id="clock">--:--</span>
      <button class="icon-btn" id="fsBtn" aria-label="Pantalla completa" title="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main>
    <nav class="modules" aria-label="Módulos">
      <a class="card speed" id="openSpeed" href="velocidad.html">
        <div class="card-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14l4-5"/><path d="M3.5 18a9 9 0 1 1 17 0"/><circle cx="12" cy="14" r="1.6" fill="#fff"/></svg>
        </div>
        <h2>Velocímetro</h2>
        <p>HUD &amp; Sonido de Motor</p>
      </a>

      <a class="card waze" id="openWaze" href="waze.html">
        <div class="card-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#04121b" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><rect x="8.5" y="7.2" width="7" height="5" rx="1.2"/><circle cx="12" cy="9.7" r="1.3"/></svg>
        </div>
        <h2>Waze</h2>
        <p>Radares &amp; Navegación</p>
      </a>

      <a class="card mirror" id="openMirror" href="compartir.html">
        <div class="card-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
            <path d="M12 18h.01"/>
            <path d="M17 6H7"/>
          </svg>
        </div>
        <h2>Compartir Pantalla</h2>
        <p>Screen Mirror Celular</p>
      </a>

      <a class="card whatsapp" id="openWhatsApp" href="https://web.whatsapp.com/" target="_blank" rel="noopener">
        <div class="card-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        </div>
        <h2>WhatsApp</h2>
        <p>Mensajería Web</p>
      </a>
    </nav>
  </main>

  <footer>VELOX Drive</footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

function tick(){
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',hour12:false});
}
tick(); setInterval(tick, 10000);

function setGps(state){
  const dot = $('gpsDot'), txt = $('gpsTxt');
  dot.className = 'dot' + (state==='granted' ? ' ok' : '');
  txt.textContent = state==='granted' ? 'GPS listo' : 'GPS';
}
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({name:'geolocation'}).then(p => { setGps(p.state); p.onchange = () => setGps(p.state); }).catch(() => setGps('prompt'));
}

const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
$('fsBtn').onclick = () => {
  const el = document.documentElement;
  if (!isFs()) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
};
</script>
</body>
</html>
